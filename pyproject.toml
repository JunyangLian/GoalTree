[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goaltree-agent"
version = "0.1.0"
description = "GoalTree: local goal planning, independent task contexts and visual agent execution"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
attachments = ["Pillow>=10.0", "pypdf>=5.0"]
web-pdf = ["pypdf>=6.21.1"]

[project.scripts]
goaltree = "goaltree.cli:main"
goaltree-web = "goaltree.web:main"
codetrail = "pico.cli:main"
codetrail-web = "pico.web:main"
pico = "pico.cli:main"
pico-web = "pico.web:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["pico*", "goaltree*"]

[tool.setuptools.package-data]
pico = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js", "web_assets/*.LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
